stages:
  - test
  - frontend
  - e2e
  - build

run-tests:
  stage: test
  image: golang:1.25
  script:
    - mkdir -p coverage
    - bash scripts/run_tests_with_coverage.sh
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

run-frontend:
  stage: frontend
  image: node:20
  script:
    - cd next_b2b_starter
    - corepack enable
    - corepack pnpm install --frozen-lockfile --ignore-scripts
    - pnpm lint
    - pnpm build
  artifacts:
    when: always
    paths:
      - next_b2b_starter/.next/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: manual

run-e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.62.1-focal
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: redis:alpine
      alias: redis
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: saas_db_test
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saas_db_test?sslmode=disable
    AUTH_MOCK_ENABLED: "true"
    NEXT_PUBLIC_API_URL: http://localhost:8080/api
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -fsSL https://go.dev/dl/go1.25.0.linux-amd64.tar.gz | tar -C /usr/local -xzf -
    - export PATH=/usr/local/go/bin:$PATH
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs
    - corepack enable
    - cd next_b2b_starter && corepack pnpm install --frozen-lockfile --ignore-scripts
    - corepack pnpm exec playwright install --with-deps chromium
  script:
    - export PATH=/usr/local/go/bin:$PATH
    - cd go-b2b-starter
    - curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.2/migrate.linux-amd64.tar.gz | tar xz
    - ./migrate -path internal/db/postgres/sqlc/migrations -database "$DATABASE_URL" up
    - POSTGRES_HOST=postgres POSTGRES_PORT=5432 POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=saas_db_test SKIP_MIGRATIONS=true go run ./cmd/seed-e2e
    - AUTH_MOCK_ENABLED=true go run ./cmd/api/main.go > /tmp/backend.log 2>&1 &
    - cd ../next_b2b_starter && pnpm dev -p 3001 > /tmp/frontend.log 2>&1 &
    - for i in $(seq 1 90); do
        if curl -fsS http://localhost:8080/health >/dev/null 2>&1 && curl -fsS -o /dev/null http://localhost:3001 >/dev/null 2>&1; then
          echo "backend + frontend healthy after ${i}s"; break
        fi
        sleep 1
      done
    - cd ../next_b2b_starter && pnpm test:e2e
  artifacts:
    when: always
    paths:
      - next_b2b_starter/test-results/
      - next_b2b_starter/playwright-report/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: manual

build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
